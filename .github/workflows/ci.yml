name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install pinned uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.28"
          enable-cache: false
          python-version: "3.12"
      - name: Install locked core and development dependencies
        run: uv sync --frozen
      - name: Enforce privacy boundary
        run: uv run hmong-tts-privacy-scan
      - name: Validate configurations
        run: uv run hmong-tts-config-check
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Test synthetic fixtures
        run: uv run pytest --cov=hmong_tts --cov-report=term-missing
