repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: privacy-scan
        name: private-data and credential scan
        entry: python scripts/check_privacy.py
        language: python
        pass_filenames: false

      - id: ruff-check
        name: ruff
        entry: ruff check
        language: python
        additional_dependencies: ["ruff==0.15.21"]
        types: [python]

      - id: ruff-format
        name: ruff format check
        entry: ruff format --check
        language: python
        additional_dependencies: ["ruff==0.15.21"]
        types: [python]
