[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "audited-tts-workbench"
version = "1.0.0"
description = "Audited public-checkpoint TTS inference and benchmarking workbench"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.136.3",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "starlette==1.3.1",
  "uvicorn==0.46.0",
]

[project.optional-dependencies]
mms = [
  "safetensors==0.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "scipy==1.18.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.13.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "transformers==5.13.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.21",
  "types-PyYAML==6.0.12.20260518",
]

[project.scripts]
tts-workbench-config = "tts_workbench.config.loader:main"
tts-workbench-env = "tts_workbench.environment.detect:main"
tts-workbench-mms-smoke = "tts_workbench.inference.mms_smoke:main"
tts-workbench-privacy-scan = "tts_workbench.privacy.scan:main"
tts-workbench-models = "tts_workbench.models.registry:main"
tts-workbench-qc = "tts_workbench.qc.cli:main"
tts-workbench-serve = "tts_workbench.service.cli:main"
tts-workbench-benchmark = "tts_workbench.benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_workbench"]
exclude = [".git"]

[tool.hatch.build.targets.sdist]
# Match both Git directories and worktree pointer files, at any depth.
exclude = [".git"]

[tool.uv]
required-version = ">=0.11.28,<0.12"
default-groups = ["dev"]
# GHSA-h35f-9h28-mq5c: constrain the optional PyTorch transitive dependency.
constraint-dependencies = ["setuptools==83.0.0"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tts_workbench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tts_workbench"]

[[tool.mypy.overrides]]
module = ["torch", "transformers"]
ignore_missing_imports = true
